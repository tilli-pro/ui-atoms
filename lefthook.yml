commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{ts,tsx,js,mjs,json,jsonc,md,yml,yaml}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files} && git add {staged_files}
pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    tests:
      run: pnpm test
