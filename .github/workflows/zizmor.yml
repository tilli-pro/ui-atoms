# Static analysis of the workflows in this directory with zizmor (https://docs.zizmor.sh):
# unpinned actions, credential persistence, template injection, excessive permissions and
# the like. Findings are uploaded to the repository's code scanning alerts; the job itself
# does not fail on them.
name: zizmor

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
