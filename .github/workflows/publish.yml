# The public repository's release workflow: the version pull request, and on its merge the
# publish (content scan, provisional guard and build run inside `pnpm release`). It does not
# run in any other repository.
name: Release

on:
  push:
    branches: [main]

# Nothing by default; the one job below asks for exactly what it needs.
permissions: {}

concurrency: release-${{ github.ref }}

jobs:
  release:
    if: github.repository == 'tilli-pro/ui-atoms'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit and release tags, create GitHub releases
      pull-requests: write # open and update the "version packages" pull request
      id-token: write # OIDC token for npm provenance
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10.19.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version pull request or publish
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}
